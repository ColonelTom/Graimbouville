# =====================================================================
#  Envoie automatiquement le dossier site/ sur l'hébergement OVH
#  (https://motdefi.fr/graimbouville/) à chaque mise à jour de la branche main.
#  Les accès FTP sont lus dans les « secrets » GitHub du dépôt :
#  FTP_SERVEUR, FTP_UTILISATEUR, FTP_MOT_DE_PASSE (jamais écrits dans le code).
# =====================================================================
name: Déployer sur OVH

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deployer-ovh.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "inspecter = lister les dossiers OVH sans rien modifier ; deployer = envoyer les fichiers"
        type: choice
        options: [inspecter, deployer, supprimer-copie-www]
        default: inspecter
      chemin:
        description: "Mode inspecter : dossier supplémentaire à lister (lecture seule)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploiement-ovh
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      FTP_SERVEUR: ${{ secrets.FTP_SERVEUR }}
      FTP_UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
      LFTP_PASSWORD: ${{ secrets.FTP_MOT_DE_PASSE }}
      # Dossier de destination sur OVH, vérifié le 6/11/2026 par inspection :
      # le dossier « motdefi » est la racine de https://motdefi.fr/ (ses fichiers
      # badge-appstore.svg, aide.php… y sont servis ; « www » sert un autre site).
      # Donc motdefi/graimbouville = https://motdefi.fr/graimbouville/
      FTP_DOSSIER: ${{ vars.FTP_DOSSIER || 'motdefi/graimbouville' }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deployer' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que les accès FTP sont renseignés
        id: verif
        run: |
          manque=""
          [ -z "$FTP_SERVEUR" ] && manque="$manque FTP_SERVEUR"
          [ -z "$FTP_UTILISATEUR" ] && manque="$manque FTP_UTILISATEUR"
          [ -z "$LFTP_PASSWORD" ] && manque="$manque FTP_MOT_DE_PASSE"
          if [ -n "$manque" ]; then
            # Pas encore configuré : on n'échoue pas, on prévient simplement.
            echo "::notice::Déploiement ignoré, secrets GitHub manquants :$manque (Settings > Secrets and variables > Actions)"
            echo "pret=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Mode : $MODE"
          if [ "$MODE" = "inspecter" ] || [ "$MODE" = "supprimer-copie-www" ]; then
            echo "pret=$MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$FTP_DOSSIER" ]; then
            echo "::notice::Envoi ignoré : la variable GitHub FTP_DOSSIER (dossier de destination vérifié) n'est pas encore définie."
            echo "pret=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Garde-fou : on n'écrit QUE dans un dossier « graimbouville »,
          # pour ne jamais toucher au reste du site motdefi.fr.
          case "$FTP_DOSSIER" in
            *graimbouville|*graimbouville/) ;;
            *) echo "::error::Le dossier de destination doit se terminer par « graimbouville » (actuel : $FTP_DOSSIER)"; exit 1 ;;
          esac
          echo "pret=true" >> "$GITHUB_OUTPUT"

      - name: Installer le client et reconnaître le serveur OVH
        if: steps.verif.outputs.pret == 'true' || steps.verif.outputs.pret == 'inspecter' || steps.verif.outputs.pret == 'supprimer-copie-www'
        # Connexion SFTP (chiffrée). La clé du serveur OVH est enregistrée pour
        # vérifier ensuite qu'on parle bien à lui.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 "$FTP_SERVEUR" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Empreintes du serveur :"; ssh-keygen -lf ~/.ssh/known_hosts || echo "::warning::Impossible de lire la clé SFTP du serveur (port 22 fermé ?)"

      - name: Inspecter les dossiers OVH (lecture seule)
        if: steps.verif.outputs.pret == 'inspecter'
        env:
          CHEMIN: ${{ inputs.chemin }}
        run: |
          lftp -u "$FTP_UTILISATEUR" --env-password "sftp://$FTP_SERVEUR" -e "
            set net:max-retries 2;
            set net:timeout 30;
            echo '=== Dossier d arrivee apres connexion :'; pwd;
            echo '=== Contenu :'; cls -1 --classify;
            echo '=== Contenu de www (s il existe) :'; cls -1 --classify www/;
            bye" || true
          if [ -n "$CHEMIN" ]; then
            lftp -u "$FTP_UTILISATEUR" --env-password "sftp://$FTP_SERVEUR" -e "
              set net:timeout 30;
              echo '=== Contenu de $CHEMIN :'; cls -1 --classify '$CHEMIN/';
              bye" || true
          fi

      # Ménage ponctuel : supprime UNIQUEMENT la copie envoyée par erreur dans
      # www/graimbouville le 6/11/2026, et seulement si elle ne contient que
      # les fichiers de l'application (comparaison exacte avec site/).
      - name: Supprimer la copie envoyée par erreur dans www/graimbouville
        if: steps.verif.outputs.pret == 'supprimer-copie-www'
        run: |
          CIBLE=www/graimbouville
          lftp -u "$FTP_UTILISATEUR" --env-password "sftp://$FTP_SERVEUR" -e "set net:timeout 30; find $CIBLE/; bye" > distant.txt || true
          sed "s#^$CIBLE/##; s#/\$##" distant.txt | grep -v '^$' | grep -v "^$CIBLE\$" | sort > distant-propre.txt
          (cd site && find . -mindepth 1 | sed 's#^\./##' | sort) > attendu.txt
          echo "--- Contenu distant :"; cat distant-propre.txt
          if [ ! -s distant-propre.txt ]; then echo "Dossier absent ou vide : rien à supprimer."; exit 0; fi
          if ! diff -u attendu.txt distant-propre.txt; then
            echo "::error::Le dossier contient autre chose que les fichiers de l'application : suppression annulée."
            exit 1
          fi
          lftp -u "$FTP_UTILISATEUR" --env-password "sftp://$FTP_SERVEUR" -e "set net:timeout 30; rm -r $CIBLE; bye"
          echo "Supprimé : $CIBLE"
          lftp -u "$FTP_UTILISATEUR" --env-password "sftp://$FTP_SERVEUR" -e "set net:timeout 30; cls -1 www/; bye" | grep -c graimbouville && { echo "::error::Toujours présent"; exit 1; } || echo "Vérifié : www/graimbouville n'existe plus."

      - name: Envoyer les fichiers sur OVH
        if: steps.verif.outputs.pret == 'true'
        # Connexion chiffrée SFTP, serveur vérifié par sa clé.
        run: |
          lftp -u "$FTP_UTILISATEUR" --env-password "sftp://$FTP_SERVEUR" -e "
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --exclude-glob .DS_Store site/ '$FTP_DOSSIER';
            bye"

      - name: Vérifier que le site répond
        if: steps.verif.outputs.pret == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://motdefi.fr/graimbouville/)
          echo "https://motdefi.fr/graimbouville/ répond : $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Le site ne répond pas encore 200 : vérifiez le dossier racine de motdefi.fr dans OVH > Multisite."
          fi
