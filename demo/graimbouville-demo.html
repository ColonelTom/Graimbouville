<title>Graimbouville</title>
<meta name="theme-color" content="#f2f2f5">
<style>
/* =====================================================================
   Graimbouville — feuille de style (mobile d'abord, mode sombre inclus)
   ===================================================================== */
:root {
  --primaire: #3d5a73;
  --primaire-clair: #eaeef2;
  --accent: #3d5a73;
  --fond: #f2f2f5;
  --carte: #ffffff;
  --texte: #1c1c1e;
  --discret: #6e6e73;
  --bordure: #e3e3e8;
  --segment: #e4e4e9;
  --bouton-gris: #e3e3e8;
  --nav-fond: rgba(249, 249, 251, .94);
  --toast: #2c2c2e;
  --danger: #c0392b;
  --succes: #3d5a73;
  --ombre: none;
  --entete-fond: #f2f2f5;
  --entete-texte: #1c1c1e;
  --sur-primaire: #ffffff;
  --rayon: 12px;
  --nav-h: 64px;
  color-scheme: light;
}
/* Thème sombre : selon le réglage du téléphone, ou forcé par data-theme */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primaire: #9bb7cf;
    --primaire-clair: #243241;
    --accent: #9bb7cf;
    --fond: #0f1012;
    --carte: #1c1c1e;
    --texte: #f2f2f7;
    --discret: #98989f;
    --bordure: #2e2e31;
    --segment: #26262a;
    --bouton-gris: #2c2c2f;
    --nav-fond: rgba(22, 22, 24, .94);
    --toast: #3a3a3d;
    --danger: #ff6b5e;
    --succes: #9bb7cf;
    --ombre: none;
    --entete-fond: #0f1012;
    --entete-texte: #f2f2f7;
    --sur-primaire: #0f1a24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primaire: #9bb7cf;
  --primaire-clair: #243241;
  --accent: #9bb7cf;
  --fond: #0f1012;
  --carte: #1c1c1e;
  --texte: #f2f2f7;
  --discret: #98989f;
  --bordure: #2e2e31;
  --segment: #26262a;
  --bouton-gris: #2c2c2f;
  --nav-fond: rgba(22, 22, 24, .94);
  --toast: #3a3a3d;
  --danger: #ff6b5e;
  --succes: #9bb7cf;
  --ombre: none;
  --entete-fond: #0f1012;
  --entete-texte: #f2f2f7;
  --sur-primaire: #0f1a24;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  background: var(--fond);
  color: var(--texte);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
a { color: var(--primaire); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
code { background: var(--primaire-clair); padding: 1px 5px; border-radius: 4px; }

/* ---------- Écrans plein écran ---------- */
.ecran-centre {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px; text-align: center; gap: 8px;
}
.logo { border-radius: 22px; }
.sous-titre { color: var(--discret); margin: 0 0 16px; }

/* ---------- Écran de connexion avec la photo de la maison ---------- */
.connexion { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--fond); }
.connexion-photo { height: 50vh; height: 50dvh; min-height: 260px; max-height: 560px; overflow: hidden; background: #c9d6e2; }
.connexion-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: block; }
.connexion-contenu {
  position: relative; flex: 1; display: flex; justify-content: center; align-items: flex-start;
  margin-top: -56px; padding: 0 16px calc(24px + env(safe-area-inset-bottom));
}
.connexion-titre { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
.connexion-titre h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.connexion-titre .sous-titre { margin: 0; font-size: 15px; }
.profils { border: none; margin: 0; padding: 0; min-width: 0; }
.profils legend { padding: 0; margin-bottom: 10px; }
.profils-grille { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.profil {
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0;
  padding: 4px 0; border: none; background: none; cursor: pointer; color: var(--discret);
}
.profil-initiale {
  width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
  font-size: 20px; font-weight: 600; background: var(--primaire-clair); color: var(--primaire);
  transition: background .15s, color .15s;
}
.profil-nom { font-size: 12.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profil.choisi { color: var(--texte); font-weight: 600; }
.profil.choisi .profil-initiale { background: var(--primaire); color: var(--sur-primaire); }
.profil:focus-visible .profil-initiale { outline: 2px solid var(--primaire); outline-offset: 2px; }
.formulaire-connexion {
  width: 100%; max-width: 400px; text-align: left; background: var(--carte);
  display: flex; flex-direction: column; gap: 14px; padding: 22px 20px; border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
}
.formulaire-connexion label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }

/* ---------- En-tête ---------- */
.entete {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--entete-fond); color: var(--entete-texte);
}
.entete h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; flex: 1; }
.entete .btn-icone { color: var(--texte); background: var(--bouton-gris); width: 36px; height: 36px; }
.pastille { font-size: 12px; background: var(--danger); color: #fff; padding: 3px 8px; border-radius: 99px; }

/* ---------- Icônes au trait ---------- */
.ico { display: inline-flex; flex: none; width: 1.15em; height: 1.15em; }
.ico svg, svg.ico { width: 100%; height: 100%; }
svg.ico, .ico svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Contenu ---------- */
main {
  padding: 12px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px);
  max-width: 720px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
}
.carte { background: var(--carte); border-radius: var(--rayon); }
.pile { display: flex; flex-direction: column; gap: 10px; }
.discret { color: var(--discret); font-size: 14px; }
.erreur { color: var(--danger); font-size: 14px; margin: 0; }

.vide { text-align: center; color: var(--discret); padding: 36px 16px; }
.vide p { margin: 4px 0; }
.rouet {
  width: 28px; height: 28px; margin: 0 auto 10px;
  border: 3px solid var(--bordure); border-top-color: var(--primaire); border-radius: 50%;
  animation: tourner .8s linear infinite;
}
@keyframes tourner { to { transform: rotate(360deg); } }

.bandeau {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; font-size: 14px;
  background: var(--primaire-clair); color: var(--texte);
}
#bandeau-installation { max-width: 720px; margin: 10px auto 0; border-radius: var(--rayon); width: calc(100% - 32px); }
#bandeau-installation span { flex: 1; }
.bandeau.info { border-radius: var(--rayon); color: var(--discret); background: var(--carte); }
.bandeau .ico { color: var(--primaire); }

/* ---------- Boutons ---------- */
button { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 16px;
  border-radius: 10px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer;
  background: var(--primaire-clair); color: var(--primaire);
}
.btn:disabled { opacity: .55; cursor: default; }
.btn.primaire { background: var(--primaire); color: var(--sur-primaire); }
.btn.secondaire { background: var(--carte); border-color: var(--bordure); color: var(--texte); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.lien { background: none; border: none; min-height: 0; padding: 6px 4px; color: var(--primaire); font-weight: 500; }
.btn.lien.danger { color: var(--danger); }
.btn.large { width: 100%; }
.btn.petit { min-height: 34px; padding: 6px 12px; font-size: 14px; }
.btn-icone {
  width: 40px; height: 40px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; background: transparent; cursor: pointer; font-size: 18px;
}
.btn-icone.petit { width: 34px; height: 34px; font-size: 16px; }
.btn-icone:disabled { opacity: .25; }
.btn-icone:active, .btn:active { transform: scale(.97); }

/* ---------- Bouton flottant ---------- */
.fab {
  position: fixed; z-index: 20;
  right: 18px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  width: 56px; height: 56px; border-radius: 50%; border: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--primaire); color: var(--sur-primaire); font-size: 26px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .2); cursor: pointer;
}
.fab .ico { stroke-width: 2.2; }
.fab:active { transform: scale(.94); }

/* ---------- Barre d'onglets du bas ---------- */
.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--nav-fond); border-top: 1px solid var(--bordure);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.onglets button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: none; background: none; font-size: 11px; color: var(--discret); cursor: pointer;
}
.onglets button .ico { width: 24px; height: 24px; }
.onglets button.actif { color: var(--primaire); font-weight: 600; }

/* ---------- Sous-onglets ---------- */
.sous-onglets { display: flex; gap: 4px; background: var(--segment); padding: 3px; border-radius: 10px; }
.sous-onglets button {
  flex: 1; border: none; background: none; padding: 8px 4px; border-radius: 8px;
  font-size: 14px; font-weight: 500; color: var(--discret); cursor: pointer; white-space: nowrap;
}
.sous-onglets button.actif { background: var(--carte); color: var(--texte); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

/* ---------- Formulaires ---------- */
input, select, textarea {
  width: 100%; font: inherit; font-size: 16px; /* 16px évite le zoom automatique sur iPhone */
  padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--bordure); background: var(--fond); color: var(--texte);
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primaire); outline-offset: 0; border-color: transparent; }
select { appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--discret) 50%), linear-gradient(135deg, var(--discret) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type="date"] { min-height: 46px; }

dialog#modale {
  width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh;
  margin: auto auto 0; padding: 0; border: none;
  border-radius: 20px 20px 0 0; background: var(--carte); color: var(--texte);
}
@media (min-width: 600px) { dialog#modale { margin: auto; border-radius: 20px; } }
dialog#modale::backdrop { background: rgba(0, 0, 0, .45); }
.formulaire { display: flex; flex-direction: column; max-height: 92vh; max-height: 92dvh; }
.formulaire-entete { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 8px 18px; border-bottom: 1px solid var(--bordure); }
.formulaire-entete h2 { font-size: 18px; }
.formulaire-corps { overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.formulaire-pied {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--bordure);
}
.formulaire .erreur { padding: 0 18px; }
.espace { flex: 1; }
.champ { display: flex; flex-direction: column; gap: 6px; }
.label { font-weight: 600; font-size: 14px; }
.aide { color: var(--discret); }
.avec-bouton { display: flex; gap: 6px; align-items: center; }

.segments { display: flex; gap: 6px; flex-wrap: wrap; }
.segments label { flex: 1 1 28%; min-width: 88px; }
.segments input { position: absolute; opacity: 0; pointer-events: none; width: 1px; }
.segments span {
  display: block; text-align: center; padding: 11px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--bordure); background: var(--fond); font-weight: 600;
}
.segments input:checked + span { background: var(--primaire); color: var(--sur-primaire); border-color: var(--primaire); }

.champ-photo .rangee { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
img.apercu { max-width: 100%; max-height: 240px; border-radius: 10px; display: block; margin-bottom: 8px; cursor: zoom-in; }
.champ-photos { display: flex; flex-direction: column; gap: 10px; }
.liste-photos-form { display: flex; flex-direction: column; gap: 10px; }
.photo-form { display: flex; gap: 10px; align-items: flex-start; }
.photo-form .miniature { width: 92px; height: 92px; }
.photo-form-texte { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }

img.miniature { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: none; cursor: zoom-in; background: var(--primaire-clair); }
img.en-chargement { background: var(--primaire-clair); min-height: 60px; animation: pulser 1.2s ease-in-out infinite; }
@keyframes pulser { 50% { opacity: .5; } }
.photo-absente { font-size: 13px; color: var(--discret); font-style: italic; }

/* ---------- Dépenses ---------- */
.filtres { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filtres select { width: auto; flex: 1 1 120px; padding: 7px 30px 7px 12px; font-size: 14px; border-radius: 99px; background-color: var(--carte); color: var(--texte); }
.filtres select.actif { border-color: var(--primaire); background-color: var(--primaire); color: var(--sur-primaire); font-weight: 600; }
.resume { padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.resume-total { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
.resume-total strong { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--texte); font-variant-numeric: tabular-nums; }
.resume-payeurs { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.resume-payeurs div { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
.groupe { display: flex; flex-direction: column; gap: 6px; }
.groupe-titre { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 500; color: var(--discret); text-transform: uppercase; letter-spacing: .04em; padding: 8px 16px 0; font-variant-numeric: tabular-nums; }
.liste { overflow: hidden; }
.ligne-depense {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 14px; background: none; border: none; border-bottom: 1px solid var(--bordure);
  text-align: left; cursor: pointer;
}
.ligne-depense:last-child { border-bottom: none; }
.ligne-depense:active { background: var(--primaire-clair); }
.icone-cat { font-size: 18px; width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--primaire-clair); color: var(--primaire); border-radius: 8px; }
.depense-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.depense-texte strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.depense-texte small { color: var(--discret); font-size: 13px; }
.montant { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.trombone { color: var(--discret); font-size: 14px; margin-left: 4px; vertical-align: -2px; }
.pied-liste { display: flex; justify-content: center; padding-top: 8px; }

/* ---------- Contacts ---------- */
.recherche { background: var(--carte); }
.contact, .coffre { padding: 4px 14px 12px; }
.contact-entete, .coffre-entete {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: none; border: none; padding: 10px 0; text-align: left; cursor: pointer;
}
.avatar { font-size: 19px; width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--primaire-clair); color: var(--primaire); border-radius: 8px; }
.contact-texte { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.contact-texte strong { font-size: 17px; }
.contact-texte small { color: var(--discret); }
.chevron { font-size: 17px; color: var(--discret); }
.contact-detail { margin: 0 0 8px; font-size: 14px; color: var(--discret); display: flex; gap: 4px; align-items: flex-start; }
.notes { white-space: pre-line; }
.contact-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.contact-actions .btn { flex: 1 1 auto; }
.grille-urgences { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.urgence {
  display: flex; flex-direction: column; padding: 12px; border-radius: 12px; text-decoration: none;
  background: var(--carte); color: var(--texte);
}
.urgence strong { font-size: 22px; color: var(--danger); font-variant-numeric: tabular-nums; }
.urgence span { font-size: 13px; color: var(--discret); }
.urgence.long strong { font-size: 17px; white-space: nowrap; }

/* ---------- Coffre-fort ---------- */
.ligne-info {
  display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center;
  padding: 8px 0; border-top: 1px solid var(--bordure); font-size: 15px;
}
.ligne-libelle { color: var(--discret); font-size: 13px; }
.ligne-valeur { word-break: break-all; min-width: 0; }
.ligne-valeur .masque { letter-spacing: .12em; color: var(--discret); }
.actions-ligne { display: flex; gap: 2px; }
@media (max-width: 380px) {
  .ligne-info { grid-template-columns: 1fr auto; }
  .ligne-libelle { grid-column: 1 / -1; }
}

/* ---------- Procédures ---------- */
.progression { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--discret); }
.progression .barre { flex: 1; height: 6px; background: var(--bordure); border-radius: 99px; overflow: hidden; }
.progression .barre div { height: 100%; background: var(--succes); transition: width .25s; }
.etape { padding: 12px 14px; }
.etape-entete { display: flex; align-items: center; gap: 12px; }
.etape-entete h3 { flex: 1; font-size: 17px; }
.etape-outils { display: flex; }
.case {
  width: 36px; height: 36px; flex: none; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--primaire); background: var(--carte); color: var(--primaire);
  font-weight: 700; cursor: pointer;
}
.case.cochee { background: var(--succes); border-color: var(--succes); color: var(--sur-primaire); }
.case .ico { stroke-width: 2.4; }
.case.repere { border: none; background: var(--primaire-clair); border-radius: 8px; cursor: default; }
.etape.faite h3, .etape.faite .etape-description { color: var(--discret); text-decoration: line-through; }
.etape-description { white-space: pre-line; margin: 10px 0 0; }
.etape-photos { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.etape-photos figure { margin: 0; }
img.photo-etape { width: 100%; max-height: 360px; object-fit: cover; border-radius: 10px; display: block; cursor: zoom-in; min-height: 120px; }
.etape-photos figcaption { margin-top: 6px; font-size: 14px; padding: 8px 10px; background: var(--fond); border-radius: 8px; white-space: pre-line; }

/* ---------- Visionneuse ---------- */
#visionneuse {
  position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .94);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
}
#visionneuse img { max-width: 100%; max-height: 82vh; object-fit: contain; }
#visionneuse .legende { color: #fff; text-align: center; max-width: 600px; white-space: pre-line; }
#visionneuse .fermer {
  position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 12px;
  width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255, 255, 255, .2); color: #fff; font-size: 20px;
}

/* ---------- Message temporaire ---------- */
#toast {
  position: fixed; left: 50%; z-index: 200;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--toast); color: #fff; padding: 10px 16px; border-radius: 12px;
  font-size: 14px; max-width: calc(100% - 32px); text-align: center; transition: all .25s;
}
#toast.visible { opacity: 1; transform: translate(-50%, 0); }
#toast.erreur { background: var(--danger); }

/* ---------- Fenêtre de confirmation ---------- */
dialog.confirmation {
  width: calc(100% - 32px); max-width: 380px; padding: 20px; border: none; border-radius: 16px;
  background: var(--carte); color: var(--texte);
}
dialog.confirmation::backdrop { background: rgba(0, 0, 0, .45); }
dialog.confirmation p { margin: 0 0 18px; font-size: 16px; }
.rangee-droite { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- Ajouts de la démo ---------- */
.bandeau-demo {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px));
  background: var(--primaire-clair); color: var(--texte); font-size: 13px;
}
.bandeau-demo > span { flex: 1 1 200px; min-width: 0; }
.aide-demo { margin: 0; font-size: 14px; color: var(--primaire); font-weight: 600; }

<script type="module">
// =====================================================================
//  DÉMO GRAIMBOUVILLE — remplace Firebase par une base en mémoire
//  remplie de FAUSSES données. Ce fichier est assemblé avec js/app.js
//  par demo/construire.py ; il n'est pas utilisé par la vraie application.
// =====================================================================
window.GRAIMBOUVILLE_DEMO = true;

const firebaseConfig = { apiKey: "DEMO" };
const PROFILS = ["Etienne", "Caroline", "Fabienne", "Amélie", "Matthias"].map((prenom) => ({
  prenom, identifiant: prenom.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + ".graimbouville@example.com"
}));
const PAYEURS = PROFILS.map((p) => p.prenom);

// ---------- Faux Firebase Auth ----------
let demoUtilisateur = null;
const demoAbonnesAuth = [];
function initializeApp(c) { return { c }; }
function getAuth() { return { get currentUser() { return demoUtilisateur; } }; }
function onAuthStateChanged(a, cb) { demoAbonnesAuth.push(cb); setTimeout(() => cb(demoUtilisateur), 0); }
async function signInWithEmailAndPassword(a, email) { // en démo, tout mot de passe est accepté
  await new Promise((r) => setTimeout(r, 400));
  demoUtilisateur = { email: email || PROFILS[0].identifiant };
  demoAbonnesAuth.forEach((s) => s(demoUtilisateur));
}
async function signOut() { demoUtilisateur = null; demoAbonnesAuth.forEach((s) => s(null)); }
async function sendPasswordResetEmail() { /* rien en démo */ }

// ---------- Faux Firestore ----------
const demoBase = {};
const demoEcouteurs = {};
let demoCompteur = 0;
const MARQUEUR_DATE = "__horodatage__";
const demoCollection = (nom) => (demoBase[nom] ||= new Map());
function demoInstantane(nom) {
  return {
    docs: [...demoCollection(nom).entries()].map(([id, d]) => ({
      id, data: () => ({ ...d, photos: d.photos ? d.photos.map((p) => ({ ...p })) : d.photos })
    }))
  };
}
function demoNotifier(nom) { (demoEcouteurs[nom] || []).forEach((cb) => cb(demoInstantane(nom))); }
function initializeFirestore() { return {}; }
function persistentLocalCache() { return {}; }
function persistentMultipleTabManager() { return {}; }
function collection(db, nom) { return { nom }; }
function doc(a, b, c) {
  if (a && a.nom && b === undefined) return { nom: a.nom, id: "demo" + (++demoCompteur) };
  return { nom: b, id: c };
}
function serverTimestamp() { return MARQUEUR_DATE; }
async function setDoc(ref, data, opts) {
  const m = demoCollection(ref.nom);
  const ancien = opts && opts.merge ? (m.get(ref.id) || {}) : {};
  const propre = {};
  for (const [k, v] of Object.entries(data)) {
    if (v === undefined) continue;
    if (v === MARQUEUR_DATE) { const t = Date.now(); propre[k] = { toMillis: () => t }; } else propre[k] = v;
  }
  m.set(ref.id, { ...ancien, ...propre });
  demoNotifier(ref.nom);
}
async function deleteDoc(ref) { demoCollection(ref.nom).delete(ref.id); demoNotifier(ref.nom); }
async function getDoc(ref) {
  await new Promise((r) => setTimeout(r, 120));
  const d = demoCollection(ref.nom).get(ref.id);
  return { exists: () => !!d, data: () => d };
}
function onSnapshot(c, cb) {
  (demoEcouteurs[c.nom] ||= []).push(cb);
  setTimeout(() => cb(demoInstantane(c.nom)), 250);
  return () => { demoEcouteurs[c.nom] = demoEcouteurs[c.nom].filter((x) => x !== cb); };
}
function writeBatch() {
  const ops = [];
  return {
    update(ref, d) { ops.push([ref, d]); },
    async commit() { for (const [r, d] of ops) await setDoc(r, d, { merge: true }); }
  };
}

// ---------- Photos d'exemple dessinées à la volée ----------
function demoPhoto(titre, emoji, teinte) {
  const c = document.createElement("canvas");
  c.width = 800; c.height = 560;
  const g = c.getContext("2d");
  const fond = g.createLinearGradient(0, 0, 800, 560);
  fond.addColorStop(0, `hsl(${teinte} 35% 78%)`);
  fond.addColorStop(1, `hsl(${teinte} 30% 58%)`);
  g.fillStyle = fond; g.fillRect(0, 0, 800, 560);
  g.font = "180px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(emoji, 400, 240);
  g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, 440, 800, 120);
  g.fillStyle = "#fff"; g.font = "bold 34px sans-serif"; g.fillText(titre, 400, 485);
  g.font = "22px sans-serif"; g.fillText("Photo d'exemple (démo)", 400, 528);
  return c.toDataURL("image/jpeg", 0.8);
}
function demoTicket() {
  const c = document.createElement("canvas");
  c.width = 500; c.height = 760;
  const g = c.getContext("2d");
  g.fillStyle = "#e9e6df"; g.fillRect(0, 0, 500, 760);
  g.fillStyle = "#fff"; g.fillRect(60, 30, 380, 700);
  g.fillStyle = "#222"; g.textAlign = "center";
  g.font = "bold 30px monospace"; g.fillText("BRICO-EXEMPLE", 250, 90);
  g.font = "18px monospace"; g.fillText("Magasin fictif — démo", 250, 122);
  g.textAlign = "left"; g.font = "20px monospace";
  const lignes = [["Peinture blanche 10L", "39,90"], ["Rouleau + bac", "6,00"], ["", ""], ["TOTAL TTC", "45,90 €"]];
  lignes.forEach(([a, b], i) => { g.fillText(a, 90, 200 + i * 44); g.textAlign = "right"; g.fillText(b, 410, 200 + i * 44); g.textAlign = "left"; });
  g.textAlign = "center"; g.font = "18px monospace"; g.fillText("Merci de votre visite", 250, 660);
  return c.toDataURL("image/jpeg", 0.8);
}

  }

  const RUBRIQUES = { depenses: "Dépenses", contacts: "Contacts", coffre: "Coffre-fort", maison: "Maison", general: "Général / autre" };

      const t = zone.value.trim();
      if (!t) return "";
      return `[${RUBRIQUES[sujet.value]}]${qui.value.trim() ? " " + qui.value.trim() + " :" : ""} ${t}`;
    };
    const exiger = () => {
      const t = texteFinal();
      if (!t) { message.textContent = "Écrivez d'abord votre remarque."; message.hidden = false; }

            : "Impossible de publier l'avis ici. Utilisez « Copier le texte » et envoyez-le par SMS ou email.";
          message.hidden = false;
          if (code === "forbidden" || code === "not_granted") btnPublier.hidden = true;
        } finally {
          btnPublier.disabled = false; btnPublier.textContent = "Publier l'avis";
        }
      }
    }, "Publier l'avis");
    btnPublier.hidden = !commentaires;

    const btnCopier = h("button", {
      type: "button", class: commentaires ? "btn secondaire" : "btn primaire",
      onclick: () => { const t = exiger(); if (t) copier(t, "Texte"); }
    }, "Copier le texte");

        h("p", { class: "discret" }, commentaires
          ? "« Publier l'avis » l'ajoute en commentaire sur cette page, lisible ensuite pour faire évoluer l'application."

      ),
      message,
      h("div", { class: "formulaire-pied" }, h("span", { class: "espace" }), btnCopier, btnPublier)
    ));
    dlg.showModal();
  }

/** Renvoie une icône prête à insérer (span contenant un dessin SVG). */
function ic(nom) {
  const s = document.createElement("span");
  s.className = "ico";
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = `<svg viewBox="0 0 24 24">${ICONES[nom] || ""}</svg>`;
  return s;
}

const $ = (sel) => document.querySelector(sel);

/** Crée un élément HTML de façon sûre (le texte n'est jamais interprété comme du HTML). */
function h(tag, attrs, ...enfants) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className = v;
    else if (k === "value") n.value = v;
    else if (k === "checked" || k === "disabled" || k === "hidden" || k === "required" || k === "selected") n[k] = !!v;
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const e of enfants.flat(Infinity)) {
    if (e === null || e === undefined || e === false) continue;
    n.append(e instanceof Node ? e : String(e));
  }
  return n;
}

const formatEuro = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const euros = (n) => formatEuro.format(Number(n) || 0);

function dateDepuisISO(iso) {
  const [a, m, j] = String(iso || "").split("-").map(Number);
  return a ? new Date(a, (m || 1) - 1, j || 1) : null;
}
function dateLisible(iso) {
  const d = dateDepuisISO(iso);
  return d ? d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : "—";
}
function moisLisible(cle) {
  const d = dateDepuisISO(cle + "-01");
  if (!d) return "Sans date";
  const t = d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function aujourdhui() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const telLien = (t) => "tel:" + String(t || "").replace(/[^\d+]/g, "");
function telLisible(t) {
  const brut = String(t || "").replace(/\s/g, "");
  if (/^0\d{9}$/.test(brut)) return brut.replace(/(\d{2})(?=\d)/g, "$1 ");
  return t || "";
}
function ibanLisible(i) {
  return String(i || "").replace(/\s/g, "").toUpperCase().replace(/(.{4})(?=.)/g, "$1 ");
}
function ibanMasque(i) {
  const brut = String(i || "").replace(/\s/g, "").toUpperCase();
  if (brut.length < 8) return "••••";
  return brut.slice(0, 4) + " •••• •••• " + brut.slice(-4);
}
function lireMontant(texte) {
  const n = Number(String(texte || "").replace(/\s/g, "").replace(",", "."));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
function stockageLire(cle) { try { return localStorage.getItem(cle); } catch { return null; } }
function stockageEcrire(cle, v) { try { localStorage.setItem(cle, v); } catch { /* ignoré */ } }

let minuteurToast;
function toast(message, erreur = false) {
  const t = $("#toast");
  // Quand une fenêtre est ouverte, le message doit s'afficher par-dessus
  const modale = $("#modale");
  const parent = modale.open ? modale : document.body;
  if (t.parentNode !== parent) parent.append(t);
  t.textContent = message;
  t.className = "visible" + (erreur ? " erreur" : "");
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { t.className = ""; }, erreur ? 5000 : 2500);
}

async function copier(texte, quoi = "Copié") {
  try {
    await navigator.clipboard.writeText(texte);
    toast(quoi + " dans le presse-papiers");
  } catch {
    // Solution de secours pour les anciens navigateurs
    const zone = h("textarea", { value: texte, readonly: true, style: "position:fixed;opacity:0" });
    document.body.append(zone);
    zone.select();
    try { document.execCommand("copy"); toast(quoi); } catch { toast("Copie impossible", true); }
    zone.remove();
  }
}

/** Fenêtre de confirmation intégrée (remplace confirm() du navigateur). */
function confirmer(message, libelleOk = "Supprimer") {
  return new Promise((repondre) => {
    const dlg = h("dialog", { class: "confirmation" });
    const fin = (v) => { dlg.close(); dlg.remove(); repondre(v); };
    dlg.append(
      h("p", {}, message),
      h("div", { class: "rangee-droite" },
        h("button", { type: "button", class: "btn secondaire", onclick: () => fin(false) }, "Annuler"),
        h("button", { type: "button", class: "btn danger", onclick: () => fin(true) }, libelleOk)
      )
    );
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); fin(false); });
    document.body.append(dlg);
    dlg.showModal();
  });
}

function messageErreur(err) {
  const code = err && err.code ? String(err.code) : "";
  const messages = {
    "auth/invalid-credential": "Mot de passe incorrect.",
    "auth/wrong-password": "Mot de passe incorrect.",
    "auth/user-not-found": "Ce profil n'a pas encore de compte dans Firebase.",
    "auth/invalid-email": "Adresse email invalide.",
    "auth/user-disabled": "Ce compte a été désactivé.",
    "auth/too-many-requests": "Trop de tentatives. Réessayez dans quelques minutes.",
    "auth/network-request-failed": "Pas de connexion internet.",
    "auth/missing-email": "Saisissez d'abord votre adresse email.",
    "permission-denied": "Accès refusé : ce compte n'est pas autorisé.",
    "unavailable": "Serveur injoignable, vérifiez la connexion.",
    "invalid-argument": "Données invalides (photo trop lourde ?)."
  };
  return messages[code] || (err && err.message) || "Erreur inconnue";
}

/**
 * Lance une écriture Firestore. Hors connexion, Firestore garde l'écriture
 * en attente et la synchronise plus tard : on n'attend donc pas plus de 2,5 s.
 */
function ecrire(promesse) {
  const suivie = promesse.catch((err) => {
    console.error(err);
    toast("Erreur d'enregistrement : " + messageErreur(err), true);
    err._signale = true;
    throw err;
  });
  return Promise.race([suivie, new Promise((ok) => setTimeout(ok, 2500))]);
}

const cachePhotos = new Map();

async function compresserImage(fichier, dimMax = 1400, tailleMax = 650000) {
  const url = URL.createObjectURL(fichier);
  try {
    const img = await new Promise((ok, ko) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => ko(new Error("Format d'image non reconnu."));
      i.src = url;
    });
    let dim = dimMax;
    let qualite = 0.78;
    let resultat = "";
    for (let essai = 0; essai < 7; essai++) {
      const ratio = Math.min(1, dim / Math.max(img.naturalWidth, img.naturalHeight));
      const l = Math.max(1, Math.round(img.naturalWidth * ratio));
      const ht = Math.max(1, Math.round(img.naturalHeight * ratio));
      const canvas = document.createElement("canvas");
      canvas.width = l;
      canvas.height = ht;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, l, ht);
      ctx.drawImage(img, 0, 0, l, ht);
      resultat = canvas.toDataURL("image/jpeg", qualite);
      if (resultat.length <= tailleMax) return resultat;
      dim = Math.round(dim * 0.8);
      qualite = Math.max(0.5, qualite - 0.07);
    }
    if (resultat.length > 950000) throw new Error("Photo trop lourde, essayez-en une autre.");
    return resultat;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function chargerPhoto(id) {
  if (!id) return null;
  if (cachePhotos.has(id)) return cachePhotos.get(id);
  const snap = await getDoc(doc(db, "photos", id));
  const data = snap.exists() ? snap.data().data : null;
  if (data) cachePhotos.set(id, data);
  return data;
}

/** Image qui se charge toute seule depuis Firestore. */
function imagePhoto(id, legende = "", classe = "miniature") {
  const img = h("img", { class: classe + " en-chargement", alt: legende || "Photo" });
  img.addEventListener("click", (e) => { e.stopPropagation(); if (img.src) ouvrirVisionneuse(img.src, legende); });
  chargerPhoto(id)
    .then((data) => {
      img.classList.remove("en-chargement");
      if (data) img.src = data;
      else img.replaceWith(h("span", { class: "photo-absente" }, "Photo introuvable"));
    })
    .catch(() => {
      img.classList.remove("en-chargement");
      img.replaceWith(h("span", { class: "photo-absente" }, "Photo indisponible hors connexion"));
    });
  return img;
}

function enregistrerNouvellePhoto(dataUrl) {
  const ref = doc(collection(db, "photos"));
  cachePhotos.set(ref.id, dataUrl);
  const promesse = ecrire(setDoc(ref, { data: dataUrl, creePar: profilCourant(), creeLe: serverTimestamp() }));
  return { id: ref.id, promesse };
}
function supprimerPhoto(id) {
  if (!id) return;
  cachePhotos.delete(id);
  ecrire(deleteDoc(doc(db, "photos", id))).catch(() => {});
}

function ouvrirVisionneuse(src, legende) {
  const v = $("#visionneuse");
  v.querySelector("img").src = src;
  v.querySelector(".legende").textContent = legende || "";
  v.hidden = false;
}
function fermerVisionneuse() {
  const v = $("#visionneuse");
  v.hidden = true;
  v.querySelector("img").removeAttribute("src");
}

/**
 * champs : [{ nom, label, type, options, requis, placeholder, aide, suggestions }]
 * types : text, email, tel, url, date, montant, textarea, select, choix, secret, photo, photos
 */
function ouvrirFormulaire({ titre, champs, valeurs = {}, onValider, onSupprimer, texteSupprimer }) {
  const dlg = $("#modale");
  const lecteurs = {};
  const form = h("form", { class: "formulaire", novalidate: true });
  form.append(h("div", { class: "formulaire-entete" },
    h("h2", {}, titre),
    h("button", { type: "button", class: "btn-icone", "aria-label": "Fermer", onclick: () => dlg.close() }, ic("croix"))
  ));
  const corps = h("div", { class: "formulaire-corps" });
  form.append(corps);

  for (const c of champs) {
    const v = valeurs[c.nom];
    let controle;

    if (c.type === "photo") {
      const champ = champPhoto(v);
      lecteurs[c.nom] = champ.lire;
      corps.append(h("div", { class: "champ" }, h("span", { class: "label" }, c.label), champ.noeud));
      continue;
    }
    if (c.type === "photos") {
      const champ = champPhotosCommentees(v || []);
      lecteurs[c.nom] = champ.lire;
      corps.append(h("div", { class: "champ" }, h("span", { class: "label" }, c.label), champ.noeud));
      continue;
    }
    if (c.type === "choix") {
      const groupe = h("div", { class: "segments" });
      const valeurInitiale = v || c.options[0];
      c.options.forEach((opt) => {
        groupe.append(h("label", {},
          h("input", { type: "radio", name: c.nom, value: opt, checked: opt === valeurInitiale }),
          h("span", {}, opt)
        ));
      });
      lecteurs[c.nom] = () => (form.querySelector(`input[name="${c.nom}"]:checked`) || {}).value || "";
      corps.append(h("div", { class: "champ" }, h("span", { class: "label" }, c.label), groupe));
      continue;
    }

    if (c.type === "textarea") {
      controle = h("textarea", { name: c.nom, rows: c.lignes || 3, placeholder: c.placeholder || "" });
      controle.value = v || "";
    } else if (c.type === "select") {
      controle = h("select", { name: c.nom },
        c.options.map((o) => {
          const val = typeof o === "string" ? o : o.valeur;
          const lib = typeof o === "string" ? o : o.libelle;
          return h("option", { value: val }, lib);
        })
      );
      if (v) controle.value = v;
    } else if (c.type === "montant") {
      controle = h("input", {
        type: "text", inputmode: "decimal", name: c.nom, placeholder: "0,00", autocomplete: "off",
        value: v !== undefined && v !== null && v !== "" ? (Number.isFinite(Number(v)) ? Number(v).toFixed(2) : String(v)).replace(".", ",") : ""
      });
    } else if (c.type === "secret") {
      const input = h("input", { type: "password", name: c.nom, autocomplete: "new-password", value: v || "", placeholder: c.placeholder || "" });
      const oeil = h("button", {
        type: "button", class: "btn-icone petit", "aria-label": "Afficher",
        onclick: () => { input.type = input.type === "password" ? "text" : "password"; }
      }, ic("oeil"));
      controle = input;
      lecteurs[c.nom] = () => input.value.trim();
      corps.append(h("label", { class: "champ" }, h("span", { class: "label" }, c.label + (c.requis ? " *" : "")),
        h("div", { class: "avec-bouton" }, input, oeil)));
      continue;
    } else {
      const attrs = {
        type: c.type || "text", name: c.nom, value: v || "", placeholder: c.placeholder || "",
        autocomplete: "off"
      };
      if (c.type === "url") attrs.inputmode = "url";
      if (c.suggestions) attrs.list = "liste-" + c.nom;
      controle = h("input", attrs);
    }

    lecteurs[c.nom] = () => controle.value.trim();
    const libelle = h("label", { class: "champ" },
      h("span", { class: "label" }, c.label + (c.requis ? " *" : "")),
      controle,
      c.aide ? h("small", { class: "aide" }, c.aide) : null
    );
    if (c.suggestions) {
      libelle.append(h("datalist", { id: "liste-" + c.nom }, c.suggestions.map((s) => h("option", { value: s }))));
    }
    corps.append(libelle);
  }

  const erreur = h("p", { class: "erreur", hidden: true });
  const btnValider = h("button", { type: "submit", class: "btn primaire" }, "Enregistrer");
  const pied = h("div", { class: "formulaire-pied" });
  if (onSupprimer) {
    pied.append(h("button", {
      type: "button", class: "btn danger",
      onclick: async () => {
        if (!(await confirmer(texteSupprimer || "Supprimer définitivement cet élément ?"))) return;
        try {
          await onSupprimer();
          dlg.close();
          toast("Supprimé");
        } catch (e) {
          if (!e._signale) toast(messageErreur(e), true);
        }
      }
    }, "Supprimer"));
  }
  pied.append(h("span", { class: "espace" }));
  pied.append(h("button", { type: "button", class: "btn secondaire", onclick: () => dlg.close() }, "Annuler"));
  pied.append(btnValider);
  form.append(erreur, pied);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const valeursLues = {};
    for (const [nom, lire] of Object.entries(lecteurs)) valeursLues[nom] = lire();
    const manquants = champs.filter((c) => c.requis && (valeursLues[c.nom] === "" || valeursLues[c.nom] === undefined));
    if (manquants.length) {
      erreur.textContent = "Champ obligatoire : " + manquants.map((c) => c.label).join(", ");
      erreur.hidden = false;
      return;
    }
    erreur.hidden = true;
    btnValider.disabled = true;
    btnValider.textContent = "Enregistrement…";
    try {
      await onValider(valeursLues);
      dlg.close();
      toast("Enregistré");
    } catch (err) {
      erreur.textContent = err._signale ? "L'enregistrement a échoué." : messageErreur(err);
      erreur.hidden = false;
    } finally {
      btnValider.disabled = false;
      btnValider.textContent = "Enregistrer";
    }
  });

  dlg.replaceChildren(form);
  dlg.showModal();
  corps.scrollTop = 0;
}

/** Champ « une seule photo » (ticket de caisse, facture). */
function champPhoto(idInitial) {
  let etatPhoto = { action: "garder" };
  let aUnePhoto = !!idInitial;
  const apercu = h("div", { class: "apercu-photo" });
  const input = h("input", { type: "file", accept: "image/*", hidden: true });
  const btnAjout = h("button", { type: "button", class: "btn secondaire" });
  const btnRetirer = h("button", { type: "button", class: "btn lien danger" }, "Retirer la photo");

  function majBoutons() {
    btnAjout.replaceChildren(ic("photo"), aUnePhoto ? "Remplacer la photo" : "Ajouter une photo");
    btnRetirer.hidden = !aUnePhoto;
  }
  function montrer(src) {
    apercu.replaceChildren();
    if (src) {
      const img = h("img", { src, class: "apercu", alt: "Aperçu" });
      img.addEventListener("click", () => ouvrirVisionneuse(src, ""));
      apercu.append(img);
    }
  }
  if (idInitial) apercu.append(imagePhoto(idInitial, "", "apercu"));
  majBoutons();

  btnAjout.addEventListener("click", () => input.click());
  btnRetirer.addEventListener("click", () => {
    etatPhoto = { action: "supprimer" };
    aUnePhoto = false;
    montrer(null);
    majBoutons();
  });
  input.addEventListener("change", async () => {
    const fichier = input.files && input.files[0];
    if (!fichier) return;
    btnAjout.disabled = true;
    btnAjout.textContent = "Traitement de la photo…";
    try {
      const data = await compresserImage(fichier);
      etatPhoto = { action: "nouvelle", dataUrl: data };
      aUnePhoto = true;
      montrer(data);
    } catch (e) {
      toast(e.message, true);
    } finally {
      btnAjout.disabled = false;
      input.value = "";
      majBoutons();
    }
  });

  return {
    noeud: h("div", { class: "champ-photo" }, apercu, h("div", { class: "rangee" }, btnAjout, btnRetirer), input),
    lire: () => etatPhoto
  };
}

/** Champ « plusieurs photos, chacune avec un commentaire » (procédures). */
function champPhotosCommentees(initiales) {
  const elements = initiales.map((p) => ({ photoId: p.photoId, commentaire: p.commentaire || "" }));
  const supprimes = [];
  const liste = h("div", { class: "liste-photos-form" });
  const input = h("input", { type: "file", accept: "image/*", multiple: true, hidden: true });
  const btnAjout = h("button", { type: "button", class: "btn secondaire" }, ic("photo"), "Ajouter des photos");

  function dessiner() {
    liste.replaceChildren();
    elements.forEach((el, i) => {
      const image = el.dataUrl
        ? h("img", { src: el.dataUrl, class: "miniature", alt: "" })
        : imagePhoto(el.photoId, el.commentaire);
      const zone = h("textarea", { rows: 2, placeholder: "Commentaire : ex. « Le robinet est derrière la trappe, sous l'évier »" });
      zone.value = el.commentaire;
      zone.addEventListener("input", () => { el.commentaire = zone.value; });
      liste.append(h("div", { class: "photo-form" },
        image,
        h("div", { class: "photo-form-texte" },
          zone,
          h("button", {
            type: "button", class: "btn lien danger",
            onclick: () => {
              if (el.photoId) supprimes.push(el.photoId);
              elements.splice(i, 1);
              dessiner();
            }
          }, "Retirer")
        )
      ));
    });
  }
  dessiner();

  btnAjout.addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const fichiers = [...(input.files || [])];
    if (!fichiers.length) return;
    btnAjout.disabled = true;
    btnAjout.textContent = "Traitement des photos…";
    for (const f of fichiers) {
      try {
        elements.push({ dataUrl: await compresserImage(f), commentaire: "" });
      } catch (e) {
        toast(e.message, true);
      }
    }
    input.value = "";
    btnAjout.disabled = false;
    btnAjout.replaceChildren(ic("photo"), "Ajouter des photos");
    dessiner();
  });

  return {
    noeud: h("div", { class: "champ-photos" }, liste, btnAjout, input),
    lire: () => ({ elements: elements.map((e) => ({ ...e, commentaire: e.commentaire.trim() })), supprimes })
  };
}

function vide(texte) {
  return h("div", { class: "vide" }, h("p", {}, texte), h("p", { class: "discret" }, "Appuyez sur « + » pour ajouter."));

function sousOnglets(types, actif, onChange) {
  return h("div", { class: "sous-onglets" },
    Object.entries(types).map(([cle, t]) =>
      h("button", { type: "button", class: cle === actif ? "actif" : "", onclick: () => onChange(cle) }, t.libelle)
    )

function filtreSelect(libelle, valeur, options, onChange) {
  const s = h("select", { "aria-label": libelle, onchange: (e) => onChange(e.target.value) },
    h("option", { value: "" }, libelle),
    options.map((o) => h("option", { value: o }, o))
  );
  s.value = valeur;
  if (valeur) s.classList.add("actif");

/** Ligne d'information (avec option secret / copie / lien). */
function ligneInfo(libelle, valeur, opts = {}) {
  if (!valeur) return null;
  const { secret = false, cleSecret = "", copiable = false, lien = null, masque = null, affichage = null } = opts;
  const revele = secret && etat.reveles.has(cleSecret);
  let texte;
  if (secret && !revele) texte = masque ? masque(valeur) : "••••••••";
  else texte = affichage ? affichage(valeur) : valeur;

  const contenuValeur = lien && (!secret || revele)
    ? h("a", { href: lien, target: lien.startsWith("http") ? "_blank" : null, rel: "noopener noreferrer" }, texte)
    : h("span", { class: secret && !revele ? "masque" : "" }, texte);

  const actions = h("span", { class: "actions-ligne" });
  if (secret) {
    actions.append(h("button", {
      type: "button", class: "btn-icone petit", "aria-label": revele ? "Masquer" : "Afficher",
      onclick: () => basculerSecret(cleSecret)
    }, ic(revele ? "oeilBarre" : "oeil")));
  }
  if (copiable) {
    actions.append(h("button", {
      type: "button", class: "btn-icone petit", "aria-label": "Copier",
      onclick: () => copier(valeur, libelle + " copié")
    }, ic("copier")));
  }
  return h("div", { class: "ligne-info" },
    h("span", { class: "ligne-libelle" }, libelle),
    h("span", { class: "ligne-valeur" }, contenuValeur),
    actions
  );
}

const minuteursSecrets = new Map();
function basculerSecret(cle) {
  if (etat.reveles.has(cle)) {
    etat.reveles.delete(cle);
  } else {
    etat.reveles.add(cle);
    clearTimeout(minuteursSecrets.get(cle));
    // Masquage automatique au bout de 30 secondes
    minuteursSecrets.set(cle, setTimeout(() => { etat.reveles.delete(cle); afficher(); }, 30000));
  }
  afficher();
}

// =====================================================================
//  MODULE A — DÉPENSES
// =====================================================================
function vueDepenses() {
  if (!etat.charge.depenses) return chargement();
  const f = etat.filtres;
  const payeurs = [...new Set([...PAYEURS, ...etat.depenses.map((d) => d.payeur).filter(Boolean)])];
  const annees = [...new Set(etat.depenses.map((d) => String(d.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();

  const liste = etat.depenses
    .filter((d) =>
      (!f.categorie || d.categorie === f.categorie) &&
      (!f.payeur || d.payeur === f.payeur) &&
      (!f.annee || String(d.date || "").startsWith(f.annee)))
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")) ||
      ((b.creeLe && b.creeLe.toMillis ? b.creeLe.toMillis() : 0) - (a.creeLe && a.creeLe.toMillis ? a.creeLe.toMillis() : 0)));

  const total = liste.reduce((s, d) => s + (Number(d.montant) || 0), 0);
  const parPayeur = {};
  liste.forEach((d) => { parPayeur[d.payeur || "?"] = (parPayeur[d.payeur || "?"] || 0) + (Number(d.montant) || 0); });

  const filtresActifs = f.categorie || f.payeur || f.annee;
  const barreFiltres = h("div", { class: "filtres" },
    filtreSelect("Toutes catégories", f.categorie, CATEGORIES, (v) => { f.categorie = v; afficher(); }),
    filtreSelect("Tous payeurs", f.payeur, payeurs, (v) => { f.payeur = v; afficher(); }),
    filtreSelect("Toutes années", f.annee, annees, (v) => { f.annee = v; afficher(); }),
    filtresActifs ? h("button", {
      type: "button", class: "btn lien",
      onclick: () => { f.categorie = ""; f.payeur = ""; f.annee = ""; afficher(); }
    }, "Effacer") : null
  );

  const resume = h("div", { class: "carte resume" },
    h("div", { class: "resume-total" },
      h("span", { class: "discret" }, filtresActifs ? "Total (filtré)" : "Total des dépenses"),
      h("strong", {}, euros(total)),
      h("span", { class: "discret" }, liste.length + " dépense" + (liste.length > 1 ? "s" : ""))
    ),
    h("div", { class: "resume-payeurs" },
      Object.entries(parPayeur)
        .sort(([a], [b]) => (PAYEURS.indexOf(a) + 1 || 99) - (PAYEURS.indexOf(b) + 1 || 99))
        .map(([p, m]) => h("div", {}, h("span", {}, p), h("strong", {}, euros(m))))
    )
  );

  if (!etat.depenses.length) return [vide("Aucune dépense enregistrée pour le moment.")];
  if (!liste.length) return [barreFiltres, h("div", { class: "vide" }, "Aucune dépense ne correspond à ces filtres.")];

  // Regroupement par mois
  const groupes = new Map();
  liste.forEach((d) => {
    const cle = String(d.date || "").slice(0, 7) || "0000-00";
    if (!groupes.has(cle)) groupes.set(cle, []);
    groupes.get(cle).push(d);
  });

  const blocs = [...groupes.entries()].map(([cle, deps]) =>
    h("section", { class: "groupe" },
      h("div", { class: "groupe-titre" },
        h("span", {}, moisLisible(cle)),
        h("span", {}, euros(deps.reduce((s, d) => s + (Number(d.montant) || 0), 0)))
      ),
      h("div", { class: "carte liste" },
        deps.map((d) => h("button", { type: "button", class: "ligne-depense", onclick: () => formulaireDepense(d) },
          h("span", { class: "icone-cat", title: d.categorie }, ic(ICONES_CATEGORIE[d.categorie] || "euro")),
          h("span", { class: "depense-texte" },
            h("strong", {}, d.libelle || "(sans intitulé)", d.photoId ? h("span", { class: "trombone", title: "Justificatif joint" }, ic("trombone")) : null),
            h("small", {}, dateLisible(d.date) + " · " + (d.categorie || "") + " · " + (d.payeur || ""))
          ),
          h("span", { class: "montant" }, euros(d.montant))
        ))
      )
    )
  );

  return [
    barreFiltres,
    resume,
    ...blocs,
    h("div", { class: "pied-liste" },
      h("button", { type: "button", class: "btn secondaire", onclick: () => exporterCSV(liste) }, ic("telecharger"), "Exporter ces dépenses (tableur)")
    )
  ];
}

function formulaireDepense(dep) {
  ouvrirFormulaire({
    titre: dep ? "Modifier la dépense" : "Nouvelle dépense",
    valeurs: dep ? { ...dep, photo: dep.photoId } : { date: aujourdhui(), payeur: PAYEURS.includes(profilCourant()) ? profilCourant() : PAYEURS[0], categorie: CATEGORIES[0] },
    champs: [
      { nom: "date", label: "Date", type: "date", requis: true },
      { nom: "libelle", label: "Intitulé / description", requis: true, placeholder: "ex : Réparation fuite toiture" },
      { nom: "categorie", label: "Catégorie", type: "select", options: CATEGORIES, requis: true },
      { nom: "montant", label: "Montant (€)", type: "montant", requis: true },
      { nom: "payeur", label: "Payé par", type: "choix", options: PAYEURS, requis: true },
      { nom: "photo", label: "Ticket de caisse / facture", type: "photo" },
      { nom: "notes", label: "Notes (facultatif)", type: "textarea", lignes: 2 }
    ],
    onValider: async (v) => {
      const montant = lireMontant(v.montant);
      if (!Number.isFinite(montant) || montant < 0) throw new Error("Le montant n'est pas valide (ex : 45,90).");
      let photoId = dep ? dep.photoId || null : null;
      const attentes = [];
      if (v.photo.action === "supprimer" || v.photo.action === "nouvelle") {
        if (photoId) supprimerPhoto(photoId);
        photoId = null;
      }
      if (v.photo.action === "nouvelle") {
        const p = enregistrerNouvellePhoto(v.photo.dataUrl);
        photoId = p.id;
        attentes.push(p.promesse);
      }
      const ref = dep ? doc(db, "depenses", dep.id) : doc(collection(db, "depenses"));
      const donnees = {
        date: v.date, libelle: v.libelle, categorie: v.categorie, montant, payeur: v.payeur,
        notes: v.notes, photoId, modifiePar: profilCourant(), modifieLe: serverTimestamp()
      };
      if (!dep) { donnees.creePar = profilCourant(); donnees.creeLe = serverTimestamp(); }
      attentes.push(ecrire(setDoc(ref, donnees, { merge: true })));
      await Promise.all(attentes);
    },
    onSupprimer: dep ? async () => {
      supprimerPhoto(dep.photoId);
      await ecrire(deleteDoc(doc(db, "depenses", dep.id)));
    } : null,
    texteSupprimer: "Supprimer cette dépense et son justificatif ?"
  });
}

function exporterCSV(liste) {
  if (window.GRAIMBOUVILLE_DEMO) {
    toast("Dans la vraie application, ce bouton télécharge un fichier Excel.");
    return;
  }
  const cellule = (v) => '"' + String(v === undefined || v === null ? "" : v).replace(/"/g, '""') + '"';
  const lignes = [["Date", "Intitulé", "Catégorie", "Montant (€)", "Payé par", "Notes", "Justificatif"].map(cellule).join(";")];
  liste.forEach((d) => {
    lignes.push([
      d.date, d.libelle, d.categorie, String(Number(d.montant) || 0).replace(".", ","),
      d.payeur, d.notes, d.photoId ? "oui" : "non"
    ].map(cellule).join(";"));
  });
  const blob = new Blob(["﻿" + lignes.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const lienTelechargement = h("a", { href: URL.createObjectURL(blob), download: `depenses-graimbouville-${aujourdhui()}.csv` });
  document.body.append(lienTelechargement);
  lienTelechargement.click();
  setTimeout(() => { URL.revokeObjectURL(lienTelechargement.href); lienTelechargement.remove(); }, 1000);
}

function vueContacts() {
  if (!etat.charge.contacts) return chargement();
  const type = etat.ongletContacts;

  const champRecherche = h("input", {
    type: "search", class: "recherche", placeholder: "Rechercher un nom, un métier…", value: etat.recherche,

// =====================================================================

// =====================================================================
function etapesDuType(type) {
  return etat.procedures
    .filter((p) => p.type === type)
    .sort((a, b) => (Number(a.ordre) || 0) - (Number(b.ordre) || 0));
}

function vueMaison() {
  if (!etat.charge.procedures) return chargement();
  const type = etat.ongletMaison;
  const etapes = etapesDuType(type);
  const estProcedure = type !== "repere";
  const nbCoches = etapes.filter((e) => etat.coches.has(e.id)).length;

  const resultat = [sousOnglets(TYPES_PROCEDURE, type, (t) => { etat.ongletMaison = t; afficher(); })];
  if (!etapes.length) {
    resultat.push(vide(TYPES_PROCEDURE[type].vide));
    return resultat;
  }

  if (estProcedure) {
    resultat.push(h("div", { class: "progression" },
      h("div", { class: "barre" }, h("div", { style: `width:${Math.round((nbCoches / etapes.length) * 100)}%` })),
      h("span", {}, `${nbCoches} / ${etapes.length} étape${etapes.length > 1 ? "s" : ""}`),
      nbCoches ? h("button", {
        type: "button", class: "btn lien",
        onclick: () => { etapes.forEach((e) => etat.coches.delete(e.id)); afficher(); }
      }, "Tout décocher") : null
    ));
  }

  resultat.push(h("div", { class: "pile" }, etapes.map((e, i) => {
    const coche = etat.coches.has(e.id);
    return h("article", { class: "carte etape" + (coche ? " faite" : "") },
      h("div", { class: "etape-entete" },
        estProcedure
          ? h("button", {
            type: "button", class: "case" + (coche ? " cochee" : ""), "aria-label": coche ? "Décocher" : "Marquer comme fait",
            onclick: () => { coche ? etat.coches.delete(e.id) : etat.coches.add(e.id); afficher(); }
          }, coche ? ic("ok") : String(i + 1))
          : h("span", { class: "case repere" }, ic("epingle")),
        h("h3", {}, e.titre),
        h("div", { class: "etape-outils" },
          h("button", { type: "button", class: "btn-icone petit", "aria-label": "Monter", disabled: i === 0, onclick: () => deplacerEtape(etapes, i, -1) }, ic("haut")),
          h("button", { type: "button", class: "btn-icone petit", "aria-label": "Descendre", disabled: i === etapes.length - 1, onclick: () => deplacerEtape(etapes, i, 1) }, ic("bas")),
          h("button", { type: "button", class: "btn-icone petit", "aria-label": "Modifier", onclick: () => formulaireEtape(type, e) }, ic("crayon"))
        )
      ),
      e.description ? h("p", { class: "etape-description" }, e.description) : null,
      (e.photos || []).length ? h("div", { class: "etape-photos" },
        e.photos.map((p) => h("figure", {},
          imagePhoto(p.photoId, p.commentaire, "photo-etape"),
          p.commentaire ? h("figcaption", {}, p.commentaire) : null
        ))
      ) : null
    );
  })));
  return resultat;
}

async function deplacerEtape(etapes, i, sens) {
  const a = etapes[i];
  const b = etapes[i + sens];
  if (!a || !b) return;
  // On renumérote toute la liste pour éviter les égalités
  const nouvelOrdre = etapes.slice();
  nouvelOrdre[i] = b;
  nouvelOrdre[i + sens] = a;
  const lot = writeBatch(db);
  nouvelOrdre.forEach((e, idx) => {
    if (Number(e.ordre) !== idx + 1) lot.update(doc(db, "procedures", e.id), { ordre: idx + 1 });
  });
  try { await ecrire(lot.commit()); } catch { /* déjà signalé */ }
}

function formulaireEtape(type, e) {
  const t = TYPES_PROCEDURE[type];
  ouvrirFormulaire({
    titre: e ? "Modifier" : (type === "repere" ? "Nouveau repère" : "Nouvelle étape — " + t.libelle),
    valeurs: e || { type },
    champs: [
      { nom: "type", label: "Rubrique", type: "select", options: Object.entries(TYPES_PROCEDURE).map(([k, v]) => ({ valeur: k, libelle: v.libelle })) },
      { nom: "titre", label: type === "repere" ? "Quoi ?" : "Titre de l'étape", requis: true, placeholder: type === "repere" ? "ex : Robinet d'arrêt général" : "ex : Ouvrir l'eau" },
      { nom: "description", label: "Explications", type: "textarea", lignes: 4, placeholder: "ex : Tourner la vanne bleue dans le sens inverse des aiguilles d'une montre, puis…" },
      { nom: "photos", label: "Photos avec commentaires", type: "photos" }
    ],
    onValider: async (v) => {
      const attentes = [];
      const photos = v.photos.elements.map((p) => {
        if (p.photoId) return { photoId: p.photoId, commentaire: p.commentaire };
        const n = enregistrerNouvellePhoto(p.dataUrl);
        attentes.push(n.promesse);
        return { photoId: n.id, commentaire: p.commentaire };
      });
      v.photos.supprimes.forEach(supprimerPhoto);

      const changeDeType = e && e.type !== v.type;
      const ordre = !e || changeDeType
        ? etapesDuType(v.type).reduce((m, x) => Math.max(m, Number(x.ordre) || 0), 0) + 1
        : e.ordre;
      const ref = e ? doc(db, "procedures", e.id) : doc(collection(db, "procedures"));
      attentes.push(ecrire(setDoc(ref, {
        type: v.type, titre: v.titre, description: v.description, photos, ordre,
        modifiePar: profilCourant(), modifieLe: serverTimestamp()
      }, { merge: true })));
      await Promise.all(attentes);
      etat.ongletMaison = v.type;
    },
    onSupprimer: e ? async () => {
      (e.photos || []).forEach((p) => supprimerPhoto(p.photoId));
      await ecrire(deleteDoc(doc(db, "procedures", e.id)));
    } : null,
    texteSupprimer: "Supprimer cette étape et ses photos ?"
  });
}

// =====================================================================
//  Navigation & affichage
// =====================================================================
const VUES = {
  depenses: { titre: "Dépenses", rendu: vueDepenses, ajouter: () => formulaireDepense(null) },
  contacts: { titre: "Contacts", rendu: vueContacts, ajouter: () => formulaireContact(null) },
  coffre: { titre: "Coffre-fort", rendu: vueCoffre, ajouter: () => formulaireCoffre(etat.ongletCoffre, null) },
  maison: { titre: "La maison", rendu: vueMaison, ajouter: () => formulaireEtape(etat.ongletMaison, null) }
};

function afficher() {
  if ($("#app").hidden) return;
  const vue = VUES[etat.route] || VUES.depenses;
  $("#titre-page").textContent = vue.titre;
  document.querySelectorAll(".onglets button").forEach((b) => b.classList.toggle("actif", b.dataset.route === etat.route));
  $("#contenu").replaceChildren(...[vue.rendu()].flat().filter(Boolean));
}

function lireRoute() {
  const r = location.hash.replace("#", "");
  etat.route = VUES[r] ? r : "depenses";
  if (etat.route !== "contacts") etat.recherche = "";
  afficher();
  window.scrollTo(0, 0);
}

function montrerEcran(nom) {
  for (const id of ["ecran-chargement", "ecran-config", "ecran-connexion", "app"]) {
    $("#" + id).hidden = id !== nom;
  }
}

// ---------------------------------------------------------------------
//  Synchronisation temps réel avec Firestore
// ---------------------------------------------------------------------
function abonner() {
  desabonner();
  for (const nom of ["depenses", "contacts", "coffre", "procedures"]) {
    const arret = onSnapshot(collection(db, nom), (snap) => {
      etat[nom] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      etat.charge[nom] = true;
      afficher();
    }, async (err) => {
      console.error(err);
      if (err.code === "permission-denied") {
        desabonner();
        await signOut(auth);
        afficherErreurConnexion("Ce compte n'est pas autorisé à accéder aux données de la famille. Vérifiez les règles de sécurité Firestore (voir le guide).");
      } else {
        toast("Synchronisation : " + messageErreur(err), true);
      }
    });
    etat.desabonnements.push(arret);
  }
}
function desabonner() {
  etat.desabonnements.forEach((f) => f());
  etat.desabonnements = [];
  for (const k of Object.keys(etat.charge)) etat.charge[k] = false;
}

// ---------------------------------------------------------------------
//  Connexion
// ---------------------------------------------------------------------
function afficherErreurConnexion(message) {
  const p = $("#erreur-connexion");
  p.textContent = message;
  p.hidden = !message;
}

let profilChoisi = null;

/** Affiche les 5 profils sur l'écran de connexion. */
function dessinerProfils() {
  const zone = $("#choix-profils");
  const form = $("#form-connexion");
  zone.replaceChildren(...PROFILS.map((p) => {
    const choisi = profilChoisi && profilChoisi.prenom === p.prenom;
    return h("button", {
      type: "button", class: "profil" + (choisi ? " choisi" : ""), "aria-pressed": choisi ? "true" : "false",
      onclick: () => {
        profilChoisi = p;
        stockageEcrire("dernier-profil", p.prenom);
        form.identifiant.value = p.identifiant;
        afficherErreurConnexion("");
        dessinerProfils();
        form.motdepasse.focus();
      }
    },
      h("span", { class: "profil-initiale" }, p.prenom.charAt(0)),
      h("span", { class: "profil-nom" }, p.prenom)
    );
  }));
}

function initialiserConnexion() {
  // Pré-sélection du dernier profil utilisé sur ce téléphone
  const dernier = stockageLire("dernier-profil");
  profilChoisi = PROFILS.find((p) => p.prenom === dernier) || null;
  if (profilChoisi) $("#form-connexion").identifiant.value = profilChoisi.identifiant;
  dessinerProfils();

  $("#form-connexion").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector("button[type=submit]");
    if (!profilChoisi) { afficherErreurConnexion("Touchez d'abord votre prénom."); return; }
    if (!f.motdepasse.value) { afficherErreurConnexion("Saisissez le mot de passe."); f.motdepasse.focus(); return; }
    afficherErreurConnexion("");
    btn.disabled = true;
    btn.textContent = "Connexion…";
    try {
      await signInWithEmailAndPassword(auth, profilChoisi.identifiant, f.motdepasse.value);
      f.motdepasse.value = "";
    } catch (err) {
      afficherErreurConnexion(messageErreur(err));
    } finally {
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });
}

function ouvrirCompte() {
  const dlg = $("#modale");
  dlg.replaceChildren(h("div", { class: "formulaire" },
    h("div", { class: "formulaire-entete" },
      h("h2", {}, "Mon compte"),
      h("button", { type: "button", class: "btn-icone", "aria-label": "Fermer", onclick: () => dlg.close() }, ic("croix"))
    ),
    h("div", { class: "formulaire-corps" },
      h("p", {}, "Connecté en tant que ", h("strong", {}, profilCourant())),
      h("p", { class: "discret" }, "Les données sont partagées en temps réel avec toute la famille et restent consultables hors connexion sur ce téléphone.")
    ),
    h("div", { class: "formulaire-pied" },
      h("span", { class: "espace" }),
      h("button", {
        type: "button", class: "btn danger",
        onclick: async () => { dlg.close(); await signOut(auth); }
      }, "Se déconnecter")
    )
  ));
  dlg.showModal();
}

// ---------------------------------------------------------------------
//  Installation sur l'écran d'accueil
// ---------------------------------------------------------------------
let invitationInstallation = null;
function bandeauInstallation() {
  const b = $("#bandeau-installation");
  const dejaInstallee = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (dejaInstallee || stockageLire("installation-masquee") === "1") { b.hidden = true; return; }
  const estIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const fermer = h("button", {
    type: "button", class: "btn-icone petit", "aria-label": "Masquer",
    onclick: () => { stockageEcrire("installation-masquee", "1"); b.hidden = true; }
  }, ic("croix"));
  if (invitationInstallation) {
    b.replaceChildren(
      h("span", {}, "Installez l'application sur votre téléphone"),
      h("button", {
        type: "button", class: "btn primaire petit",
        onclick: async () => { invitationInstallation.prompt(); await invitationInstallation.userChoice; invitationInstallation = null; b.hidden = true; }
      }, "Installer"),
      fermer
    );
    b.hidden = false;
  } else if (estIOS) {
    b.replaceChildren(h("span", {}, "Pour installer : touchez « Partager » puis « Sur l'écran d'accueil »."), fermer);
    b.hidden = false;
  }
}

// ---------------------------------------------------------------------
//  Démarrage
// ---------------------------------------------------------------------
function demarrer() {
  // Visionneuse
  $("#visionneuse").addEventListener("click", fermerVisionneuse);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerVisionneuse(); });

  // Fermer la modale en touchant le fond
  $("#modale").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

  // Navigation
  document.querySelectorAll(".onglets button").forEach((b) => {
    b.addEventListener("click", () => { location.hash = b.dataset.route; });
  });
  window.addEventListener("hashchange", lireRoute);
  $("#fab").addEventListener("click", () => (VUES[etat.route] || VUES.depenses).ajouter());
  $("#btn-compte").addEventListener("click", ouvrirCompte);

  // Masquer les secrets dès que l'application passe en arrière-plan
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && etat.reveles.size) { etat.reveles.clear(); afficher(); }
  });

  // Indicateur hors connexion
  const majReseau = () => { $("#hors-ligne").hidden = navigator.onLine; };
  window.addEventListener("online", majReseau);
  window.addEventListener("offline", majReseau);
  majReseau();

  // Installation PWA (Android / Chrome)
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    invitationInstallation = e;
    bandeauInstallation();
  });

  if (!configOK) { montrerEcran("ecran-config"); return; }

  initialiserConnexion();
  onAuthStateChanged(auth, (utilisateur) => {
    if (utilisateur) {
      montrerEcran("app");
      bandeauInstallation();
      abonner();
      lireRoute();
    } else {
      desabonner();
      etat.depenses = []; etat.contacts = []; etat.coffre = []; etat.procedures = [];
      etat.reveles.clear();
      cachePhotos.clear();
      montrerEcran("ecran-connexion");
    }
  });
}


demarrer();

</script>
